<svg width="1200" height="132" viewBox="0 0 1200 132" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Toolchain status bar</title>
  <desc id="desc">A dark terminal style bar listing development tools.</desc>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58A6FF"/>
      <stop offset="0.5" stop-color="#3FB950"/>
      <stop offset="1" stop-color="#F78166"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="1198" height="130" rx="18" fill="#0D1117" stroke="#30363D"/>
  <rect x="1" y="1" width="1198" height="34" rx="18" fill="#161B22"/>
  <path d="M1 35H1199" stroke="#30363D"/>
  <circle cx="25" cy="18" r="5" fill="#F85149"/>
  <circle cx="43" cy="18" r="5" fill="#D29922"/>
  <circle cx="61" cy="18" r="5" fill="#3FB950"/>
  <text x="88" y="23" fill="#8B949E" font-family="monospace" font-size="13">toolchain.lock</text>
