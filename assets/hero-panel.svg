  <rect x="22" y="383" width="1156" height="25" rx="0" fill="#0A3069"/>
  <text x="46" y="400" fill="#C9D1D9" font-family="monospace" font-size="12">main</text>
  <circle cx="104" cy="395" r="4" fill="#3FB950"/>
  <text x="122" y="400" fill="#C9D1D9" font-family="monospace" font-size="12">build passing</text>
  <text x="1016" y="400" fill="#C9D1D9" font-family="monospace" font-size="12">TS / Python / Git</text>
  <rect x="22" y="22" width="1156" height="386" rx="18" stroke="url(#accent)" stroke-opacity="0.38"/>
