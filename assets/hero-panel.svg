    <text x="346" y="248" fill="#79C0FF">mode</text>
    <text x="398" y="248" fill="#C9D1D9">:</text>
    <text x="422" y="248" fill="#A5D6FF">"build &gt; brag"</text>
    <text x="574" y="248" fill="#C9D1D9">,</text>

    <text x="274" y="280" fill="#484F58">05</text>
    <text x="346" y="280" fill="#79C0FF">loop</text>
    <text x="398" y="280" fill="#C9D1D9">:</text>
    <text x="422" y="280" fill="#C9D1D9">[</text>
    <text x="442" y="280" fill="#A5D6FF">"read"</text>
    <text x="506" y="280" fill="#C9D1D9">,</text>
    <text x="526" y="280" fill="#A5D6FF">"debug"</text>
    <text x="606" y="280" fill="#C9D1D9">,</text>
    <text x="626" y="280" fill="#A5D6FF">"ship"</text>
    <text x="690" y="280" fill="#C9D1D9">]</text>
    <text x="710" y="280" fill="#C9D1D9">,</text>

    <text x="274" y="312" fill="#484F58">06</text>
    <text x="346" y="312" fill="#79C0FF">current</text>
    <text x="422" y="312" fill="#C9D1D9">:</text>
    <text x="446" y="312" fill="#A5D6FF">"knowledge -&gt; tools"</text>

    <text x="274" y="344" fill="#484F58">07</text>
    <text x="322" y="344" fill="#C9D1D9">};</text>
  </g>

  <rect x="802" y="64" width="376" height="344" fill="#010409"/>
  <text x="828" y="100" fill="#8B949E" font-family="monospace" font-size="13">TERMINAL</text>
  <g font-family="monospace" font-size="15">
    <text x="828" y="140" fill="#3FB950">$</text>
    <text x="850" y="140" fill="#C9D1D9">whoami</text>
    <text x="828" y="170" fill="#58A6FF">JulianZJN</text>

    <text x="828" y="214" fill="#3FB950">$</text>
    <text x="850" y="214" fill="#C9D1D9">git status --short</text>
    <text x="828" y="244" fill="#8B949E">clean tree, dirty ideas</text>

    <text x="828" y="288" fill="#3FB950">$</text>
    <text x="850" y="288" fill="#C9D1D9">npm run ship</text>
    <text x="828" y="318" fill="#3FB950">PASS</text>
