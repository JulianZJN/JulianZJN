name: Build KVAF paper structure corpus

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/build-paper-corpus.yml
      - _paper_corpus_job/**
  workflow_dispatch:

permissions:
  contents: read

env:
  CORPUS_ROOT: KVAF_Paper_Structure_Corpus_20260824
  OUT_ZIP: KVAF_Paper_Structure_Corpus_20260824.zip
  MANIFEST_PATH: papers.json

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout isolated corpus branch
        uses: actions/checkout@v4

      - name: Install OCR and PDF system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr poppler-utils

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install extraction dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pymupdf pymupdf4llm pillow pytesseract

      - name: Decode frozen builder, manifest, and reports
        run: |
          base64 -d _paper_corpus_job/build_paper_corpus.py.gz.b64 | gunzip > build_paper_corpus.py
          base64 -d _paper_corpus_job/papers.json.gz.b64 | gunzip > papers.json
          base64 -d _paper_corpus_job/postprocess_reports.py.gz.b64 | gunzip > postprocess_reports.py
          python -m py_compile build_paper_corpus.py postprocess_reports.py
          python - <<'PY'
          import json
          p=json.load(open('papers.json'))
          assert len(p)==32, len(p)
          print('papers:', len(p))
          PY

      - name: Download, extract, OCR-fallback, render, and analyze
        run: |
          set -o pipefail
          python build_paper_corpus.py 2>&1 | tee build.log

      - name: Generate Chinese reports and repack
        run: |
          set -o pipefail
          python postprocess_reports.py 2>&1 | tee -a build.log

      - name: Print corpus statistics
        if: always()
        run: |
          echo '--- AGGREGATE STATISTICS ---'
          cat KVAF_Paper_Structure_Corpus_20260824/03_cross_paper_analysis/AGGREGATE_STATISTICS.json || true
          echo '--- MANIFEST STATUS ---'
          python - <<'PY'
          import csv, pathlib, json
          p=pathlib.Path('KVAF_Paper_Structure_Corpus_20260824/00_manifest/papers.csv')
          if p.exists():
              rows=list(csv.DictReader(p.open()))
              ok=[r for r in rows if r.get('download_ok','').lower() in {'true','1'}]
              bad=[r for r in rows if r not in ok]
              print(json.dumps({'total':len(rows),'ok':len(ok),'failed':[{'slug':r.get('slug'),'error':r.get('errors','')} for r in bad]},indent=2))
          PY

      - name: Write workflow status
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib, hashlib
          z=pathlib.Path('KVAF_Paper_Structure_Corpus_20260824.zip')
          d={'zip_exists':z.exists(),'zip_bytes':z.stat().st_size if z.exists() else 0}
          if z.exists(): d['sha256']=hashlib.sha256(z.read_bytes()).hexdigest()
          pathlib.Path('workflow_status.json').write_text(json.dumps(d,indent=2))
          print(d)
          PY

      - name: Upload complete corpus ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KVAF_Paper_Structure_Corpus_20260824
          path: |
            KVAF_Paper_Structure_Corpus_20260824.zip
            build.log
            workflow_status.json
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
